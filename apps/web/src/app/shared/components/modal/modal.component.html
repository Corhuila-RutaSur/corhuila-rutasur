@if(abierto){<div class="fondo" (click)="cancelar.emit()"><section class="dialogo" role="dialog" aria-modal="true" (click)="$event.stopPropagation()"><img class="mascota" src="/assets/mascota/tati-bienvenida.png" alt="Tati, mascota de RutaSur"/><span class="icono" [class.peligro]="variante==='peligro'">{{variante==='peligro'?'!':'i'}}</span><h2>{{titulo}}</h2><p>{{descripcion}}</p><footer><button type="button" class="secundario" (click)="cancelar.emit()">Cancelar</button><button type="button" class="confirmar" [class.peligro]="variante==='peligro'" (click)="confirmar.emit()">{{textoConfirmar}}</button></footer></section></div>}
