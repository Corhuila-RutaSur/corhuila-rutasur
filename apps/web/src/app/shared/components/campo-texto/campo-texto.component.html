<mat-form-field appearance="outline" class="campo-texto">
  <mat-label>{{ etiqueta }}</mat-label>
  <input matInput [type]="tipo" [formControl]="control" [placeholder]="marcador" />
  @if (ayuda && !obtenerError()) {
    <mat-hint>{{ ayuda }}</mat-hint>
  }
  @if (obtenerError(); as mensajeError) {
    <mat-error>{{ mensajeError }}</mat-error>
  }
</mat-form-field>
