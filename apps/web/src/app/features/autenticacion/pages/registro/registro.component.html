<main class="registro"><section><a routerLink="/iniciar-sesion">← Volver al inicio de sesión</a><h1>Crea tu cuenta</h1><p>Tati te acompañará en tus próximas rutas.</p><form [formGroup]="formulario" (ngSubmit)="registrar()"><label>Tipo de documento<select formControlName="tipoDocumento"><option>CC</option><option>CE</option><option>PA</option></select></label><label>Número de documento<input formControlName="numeroDocumento" /></label><label>Nombres<input formControlName="nombres" /></label><label>Apellidos<input formControlName="apellidos" /></label><label>Correo electrónico<input type="email" formControlName="correo" /></label><label>Teléfono colombiano<input inputmode="numeric" formControlName="telefono" /></label><label>Contraseña<input type="password" formControlName="contrasenia" /></label>@if(formulario.touched&&formulario.invalid){<small>Revisa los datos: teléfono de 10 dígitos iniciando en 3 y contraseña de mínimo 8 caracteres.</small>}<button [disabled]="enviando()">{{enviando()?'Creando cuenta…':'Crear cuenta'}}</button></form></section><img src="/assets/mascota/tati-bienvenida.png" alt="Tati, exploradora de RutaSur" /></main>
