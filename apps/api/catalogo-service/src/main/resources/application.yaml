spring:
  application:
    name: rutasur-catalogo
  datasource:
    url: ${CATALOGO_DB_URL:jdbc:postgresql://localhost:5433/rutasur_catalogo_db}
    username: ${CATALOGO_DB_USERNAME:postgres}
    password: ${CATALOGO_DB_PASSWORD:postgres}
  jpa:
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
  messages:
    basename: message

server:
  port: ${CATALOGO_PORT:8092}

app:
  archivos:
    directorio-imagenes: ${CATALOGO_DIRECTORIO_IMAGENES:${user.home}/RutaSur/catalogo/imagenes}
  mensajeria:
    endpoint: ${AWS_ENDPOINT_URL:http://localhost:4566}
    region: ${AWS_REGION:us-east-1}
    topico-catalogo: ${CATALOGO_TOPIC_ARN:arn:aws:sns:us-east-1:000000000000:catalogo.experiencia}
    intervalo-publicacion-ms: ${MENSAJERIA_INTERVALO_PUBLICACION_MS:2000}

management:
  endpoints:
    web:
      exposure:
        include: health,info

scalar:
  enabled: true
  url: /v3/api-docs
