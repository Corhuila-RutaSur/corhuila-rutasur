spring:
  application:
    name: rutasur-pagos
  datasource:
    url: ${PAGOS_DB_URL:jdbc:postgresql://localhost:5433/rutasur_pagos_db}
    username: ${PAGOS_DB_USERNAME:postgres}
    password: ${PAGOS_DB_PASSWORD:postgres}
  jpa:
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true

server:
  port: ${PAGOS_PORT:8094}

app:
  mensajeria:
    endpoint: ${AWS_ENDPOINT_URL:http://localhost:4566}
    region: ${AWS_REGION:us-east-1}
    topico-pagos: ${PAGOS_TOPIC_ARN:arn:aws:sns:us-east-1:000000000000:pagos.pago}
    cola-reservas: ${PAGOS_RESERVAS_QUEUE_URL:http://localhost:4566/000000000000/pagos-reserva}
    intervalo-publicacion-ms: ${MENSAJERIA_INTERVALO_PUBLICACION_MS:2000}
    intervalo-consumo-ms: ${MENSAJERIA_INTERVALO_CONSUMO_MS:1000}

management:
  endpoints:
    web:
      exposure:
        include: health,info

scalar:
  enabled: true
  url: /v3/api-docs
