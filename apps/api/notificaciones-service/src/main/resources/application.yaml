spring:
  application:
    name: rutasur-notificaciones
  datasource:
    url: ${NOTIFICACIONES_DB_URL:jdbc:postgresql://localhost:5433/rutasur_notificaciones_db}
    username: ${NOTIFICACIONES_DB_USERNAME:postgres}
    password: ${NOTIFICACIONES_DB_PASSWORD:postgres}
  jpa:
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
  messages:
    basename: message

server:
  port: ${NOTIFICACIONES_PORT:8096}

app:
  mensajeria:
    endpoint: ${AWS_ENDPOINT_URL:http://localhost:4566}
    region: ${AWS_REGION:us-east-1}
    cola-reservas: ${NOTIFICACIONES_RESERVAS_QUEUE_URL:http://localhost:4566/000000000000/notificaciones-reserva}
    intervalo-consumo-ms: ${MENSAJERIA_INTERVALO_CONSUMO_MS:1000}

management:
  endpoints:
    web:
      exposure:
        include: health,info

scalar:
  enabled: true
  url: /v3/api-docs
